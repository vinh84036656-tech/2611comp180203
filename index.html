<style>
  :root { --bg:#0f172a; --tab:#cbd5e1; --active:#38bdf8; }

  .brand { color: #fff; font-weight: 700; margin-right: 12px; white-space: nowrap; }
  .tab { background: none; border: 0; color: var(--tab); font: inherit; cursor: pointer;

  .tab:hover { color: #fff; }
  .tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--active); }
  .tab:focus-visible { outline: 3px solid var(--active); outline-offset: -3px; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>

: 14px;\n    padding: 28px;\n  }\n  .hero .tag {\n    display: inline-block;\n    background: #38bdf8;\n    color: #0f172a;\n    font-size: 12px;\n    font-weight: 700;\n    padding: 2px 10px;\n    border-radius: 999px;\n    margin-bottom: 10px;\n  }\n  .hero h2 { margin: 0 0 8px; font-size: 24px; }\n  .hero p { color: #cbd5e1; max-width: 640px; }\n  .cards {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));\n    gap: 20px;\n  }\n  .card {\n    background: #fff;\n    border-radius: 12px;\n    padding: 20px;\n    box-shadow: 0 1px 3px rgba(0,0,0,.1);\n  }\n  .card .icon { font-size: 28px; margin-bottom: 8px; }\n  .card h4 { margin-bottom: 6px; }\n  .card p { color: #6b7280; font-size: 14px; }\n  .card .meta { margin-top: 10px; font-size: 12px; color: #0369a1; font-weight: 600; }\n\n  /* Bảng ngôn ngữ lập trình */\n  .table-wrap { overflow-x: auto; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }\n  table { width: 100%; border-collapse: collapse; min-width: 480px; }\n  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }\n  th { background: #f9fafb; color: #6b7280; }\n  tr:last-child td { border-bottom: 0; }\n\n  pre {\n    background: #0f172a;\n    color: #e2e8f0;\n    padding: 16px;\n    border-radius: 12px;\n    overflow-x: auto;\n    font-size: 14px;\n    line-height: 1.6;\n  }\n  pre .k { color: #38bdf8; }\n  pre .s { color: #86efac; }\n  pre .c { color: #94a3b8; }\n\n  .footer {\n    grid-area: footer;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    padding: 18px;\n    background: #0f172a;\n    color: #94a3b8;\n    font-size: 14px;\n    text-align: center;\n  }\n\n  @media (max-width: 768px) {\n    .layout {\n      grid-template-columns: 1fr;\n      grid-template-rows: auto auto 1fr auto;\n      grid-template-areas:\n        \"header\"\n        \"sidebar\"\n        \"main\"\n        \"footer\";\n    }\n    .header { flex-direction: column; padding: 12px; gap: 8px; position: static; }\n    .sidebar { border-right: 0; border-bottom: 1px solid #e5e7eb; }\n    .sidebar ul { grid-auto-flow: column; overflow-x: auto; }\n    .sidebar a { white-space: nowrap; }\n    .hero { padding: 20px; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"layout\">\n\n  <header class=\"header\">\n    <div class=\"logo\">Tech<span>VN<\/span><\/div>\n    <ul class=\"nav\">\n      <li><a href=\"#\">Trang chủ<\/a><\/li>\n      <li><a href=\"#\">Bài viết<\/a><\/li>\n      <li><a href=\"#\">Khóa học<\/a><\/li>\n      <li><a href=\"#\">Liên hệ<\/a><\/li>\n    <\/ul>\n  <\/header>\n\n  <aside class=\"sidebar\">\n    <h3>Chủ đề IT<\/h3>\n    <ul>\n      <li><a href=\"#\" class=\"active\">Tổng quan<\/a><\/li>\n      <li><a href=\"#\">Lập trình<\/a><\/li>\n      <li><a href=\"#\">Mạng máy tính<\/a><\/li>\n      <li><a href=\"#\">An ninh mạng<\/a><\/li>\n      <li><a href=\"#\">Trí tuệ nhân tạo<\/a><\/li>\n      <li><a href=\"#\">Cơ sở dữ liệu<\/a><\/li>\n      <li><a href=\"#\">Điện toán đám mây<\/a><\/li>\n    <\/ul>\n  <\/aside>\n\n  <main class=\"main\">\n    <h1>Kiến thức Công nghệ thông tin<\/h1>\n    <p class=\"sub\">Tổng hợp kiến thức nền tảng và xu hướng mới cho người học IT.<\/p>\n\n    <section class=\"hero\">\n      <span class=\"tag\">Nổi bật<\/span>\n      <h2>Lộ trình trở thành lập trình viên cho người mới bắt đầu<\/h2>\n      <p>Bắt đầu từ tư duy thuật toán, chọn một ngôn ngữ đầu tiên, rồi làm dự án nhỏ để rèn kỹ năng thực tế. Học đều mỗi ngày hiệu quả hơn học dồn.<\/p>\n    <\/section>\n\n    <h2>Các lĩnh vực chính<\/h2>\n    <div class=\"cards\">\n      <article class=\"card\">\n        <div class=\"icon\">💻<\/div>\n        <h4>Lập trình<\/h4>\n        <p>Viết phần mềm, website và ứng dụng bằng các ngôn ngữ như Python, JavaScript, Java.<\/p>\n        <div class=\"meta\">Dành cho người mới<\/div>\n      <\/article>\n      <article class=\"card\">\n        <div class=\"icon\">🌐<\/div>\n        <h4>Mạng máy tính<\/h4>\n        <p>Tìm hiểu mô hình OSI, TCP/IP, địa chỉ IP, DNS và cách các thiết bị kết nối với nhau.<\/p>\n        <div class=\"meta\">Nền tảng quan trọng<\/div>\n      <\/article>\n      <article class=\"card\">\n        <div class=\"icon\">🔒<\/div>\n        <h4>An ninh mạng<\/h4>\n        <p>Bảo vệ hệ thống và dữ liệu trước các mối đe dọa như phishing, mã độc và tấn công mạng.<\/p>\n        <div class=\"meta\">Nhu cầu nhân lực cao<\/div>\n      <\/article>\n      <article class=\"card\">\n        <div class=\"icon\">🤖<\/div>\n        <h4>Trí tuệ nhân tạo<\/h4>\n        <p>Học máy, xử lý ngôn ngữ tự nhiên và các ứng dụng AI trong đời sống, doanh nghiệp.<\/p>\n        <div class=\"meta\">Xu hướng mới<\/div>\n      <\/article>\n      <article class=\"card\">\n        <div class=\"icon\">🗄️<\/div>\n        <h4>Cơ sở dữ liệu<\/h4>\n        <p>Lưu trữ và truy vấn dữ liệu với SQL (MySQL, PostgreSQL) hoặc NoSQL (MongoDB).<\/p>\n        <div class=\"meta\">Kỹ năng bắt buộc<\/div>\n      <\/article>\n      <article class=\"card\">\n        <div class=\"icon\">☁️<\/div>\n        <h4>Điện toán đám mây<\/h4>\n        <p>Triển khai ứng dụng trên AWS, Azure, Google Cloud với chi phí linh hoạt, dễ mở rộng.<\/p>\n        <div class=\"meta\">Được săn đón<\/div>\n      <\/article>\n    <\/div>\n\n    <h2>Một số ngôn ngữ lập trình phổ biến<\/h2>\n    <div class=\"table-wrap\">\n      <table>\n        <thead>\n          <tr><th>Ngôn ngữ<\/th><th>Ứng dụng chính<\/th><th>Độ dễ học<\/th><\/tr>\n        <\/thead>\n        <tbody>\n          <tr><td>Python<\/td><td>AI, phân tích dữ liệu, tự động hóa<\/td><td>Dễ<\/td><\/tr>\n          <tr><td>JavaScript<\/td><td>Phát triển web (front-end, back-end)<\/td><td>Trung bình<\/td><\/tr>\n          <tr><td>Java<\/td><td>Ứng dụng doanh nghiệp, Android<\/td><td>Trung bình<\/td><\/tr>\n          <tr><td>C++<\/td><td>Game, hệ thống, phần mềm hiệu năng cao<\/td><td>Khó<\/td><\/tr>\n          <tr><td>SQL<\/td><td>Truy vấn và quản lý cơ sở dữ liệu<\/td><td>Dễ<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n\n    <h2>Ví dụ code đầu tiên<\/h2>\n    <pre><span class=\"c\"># Chương trình Python in lời chào<\/span>\n<span class=\"k\">def<\/span> chao(ten):\n    <span class=\"k\">return<\/span> <span class=\"s\">f\"Xin chào, {ten}!\"<\/span>\n\n<span class=\"k\">print<\/span>(chao(<span class=\"s\">\"thế giới IT\"<\/span>))<\/pre>\n  <\/main>\n\n  <footer class=\"footer\">© 2026 TechVN. Chia sẻ kiến thức công nghệ thông tin.<\/footer>\n\n<\/div>\n\n<\/body>\n<\/html>"}, {"id": "menu", "name": "Menu", "html": "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Menu<\/title>\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: \"Segoe UI\", Roboto, Arial, sans-serif; background: #f3f4f6; }\n\n  .navbar {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 0 24px; height: 64px; background: #0f172a;\n    position: sticky; top: 0; z-index: 100;\n  }\n  .logo { font-size: 22px; font-weight: 700; color: #fff; text-decoration: none; }\n  .logo span { color: #38bdf8; }\n\n  .menu { display: flex; list-style: none; gap: 4px; }\n  .menu > li { position: relative; }\n  .menu a {\n    display: block; padding: 22px 16px; color: #cbd5e1;\n    text-decoration: none; font-size: 15px; transition: color .2s, background .2s;\n  }\n  .menu > li > a:hover,\n  .menu > li:focus-within > a,\n  .menu > li > a.active { color: #fff; background: rgba(255,255,255,.08); }\n  .menu > li > a.active { box-shadow: inset 0 -3px 0 #38bdf8; }\n\n  .has-sub > a::after { content: \"▾\"; margin-left: 6px; font-size: 12px; }\n\n  .submenu {\n    position: absolute; top: 100%; left: 0; min-width: 210px; list-style: none;\n    background: #fff; border-radius: 0 0 10px 10px;\n    box-shadow: 0 10px 25px rgba(0,0,0,.18); overflow: hidden;\n    opacity: 0; visibility: hidden; transform: translateY(8px);\n    transition: opacity .2s, transform .2s, visibility .2s;\n  }\n  .has-sub:hover > .submenu,\n  .has-sub:focus-within > .submenu { opacity: 1; visibility: visible; transform: translateY(0); }\n  .submenu a { padding: 12px 18px; color: #374151; }\n  .submenu a:hover { background: #e0f2fe; color: #0369a1; }\n\n  .menu .btn-cta {\n    margin: 12px 0 12px 8px; padding: 10px 18px; background: #38bdf8;\n    color: #0f172a; font-weight: 700; border-radius: 8px;\n  }\n  .menu .btn-cta:hover { background: #7dd3fc; color: #0f172a; }\n\n  .toggle { display: none; }\n  .burger { display: none; cursor: pointer; padding: 10px; }\n  .burger span, .burger span::before, .burger span::after {\n    display: block; width: 24px; height: 3px; background: #fff;\n    border-radius: 2px; position: relative; transition: transform .25s, background .25s;\n  }\n  .burger span::before, .burger span::after { content: \"\"; position: absolute; left: 0; }\n  .burger span::before { top: -8px; }\n  .burger span::after { top: 8px; }\n  .toggle:checked + .burger span { background: transparent; }\n  .toggle:checked + .burger span::before { transform: translateY(8px) rotate(45deg); }\n  .toggle:checked + .burger span::after { transform: translateY(-8px) rotate(-45deg); }\n\n  @media (max-width: 800px) {\n    .burger { display: block; }\n    .menu {\n      position: absolute; top: 64px; left: 0; right: 0; flex-direction: column;\n      gap: 0; background: #0f172a; max-height: 0; overflow: hidden;\n      transition: max-height .3s ease;\n    }\n    .toggle:checked ~ .menu { max-height: 80vh; overflow-y: auto; }\n    .menu a { padding: 14px 24px; }\n    .menu > li > a.active { box-shadow: inset 4px 0 0 #38bdf8; }\n    .submenu {\n      position: static; opacity: 1; visibility: visible; transform: none;\n      background: rgba(255,255,255,.05); border-radius: 0; box-shadow: none;\n    }\n    .submenu a { color: #94a3b8; padding-left: 42px; }\n    .submenu a:hover { background: rgba(255,255,255,.08); color: #fff; }\n    .menu .btn-cta { margin: 12px 24px 16px; text-align: center; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<nav class=\"navbar\">\n  <a href=\"#\" class=\"logo\">Tech<span>VN<\/span><\/a>\n\n  <input type=\"checkbox\" id=\"toggle\" class=\"toggle\">\n  <label for=\"toggle\" class=\"burger\" aria-label=\"Mở menu\"><span><\/span><\/label>\n\n  <ul class=\"menu\">\n    <li><a href=\"#\" class=\"active\">Trang chủ<\/a><\/li>\n    <li class=\"has-sub\">\n      <a href=\"#\">Lập trình<\/a>\n      <ul class=\"submenu\">\n        <li><a href=\"#\">Python<\/a><\/li>\n        <li><a href=\"#\">JavaScript<\/a><\/li>\n        <li><a href=\"#\">Java<\/a><\/li>\n        <li><a href=\"#\">C++<\/a><\/li>\n      <\/ul>\n    <\/li>\n    <li class=\"has-sub\">\n      <a href=\"#\">Hạ tầng<\/a>\n      <ul class=\"submenu\">\n        <li><a href=\"#\">Mạng máy tính<\/a><\/li>\n        <li><a href=\"#\">An ninh mạng<\/a><\/li>\n        <li><a href=\"#\">Điện toán đám mây<\/a><\/li>\n      <\/ul>\n    <\/li>\n    <li><a href=\"#\">Khóa học<\/a><\/li>\n    <li><a href=\"#\">Liên hệ<\/a><\/li>\n    <li><a href=\"#\" class=\"btn-cta\">Đăng ký<\/a><\/li>\n  <\/ul>\n<\/nav>\n\n<\/body>\n<\/html>"}, {"id": "dropcap", "name": "Drop cap", "html": "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Drop Cap<\/title>\n<style>\n  body {\n    max-width: 600px;\n    margin: 40px auto;\n    padding: 0 20px;\n    font-family: Georgia, \"Times New Roman\", serif;\n    font-size: 18px;\n    line-height: 1.7;\n    color: #333;\n  }\n\n  .drop-cap::first-letter {\n    float: left;\n    font-size: 4.5em;\n    line-height: 0.85;\n    font-weight: bold;\n    margin: 0.05em 0.12em 0 0;\n    color: #c0392b;\n  }\n<\/style>\n<\/head>\n<body>\n\n<p class=\"drop-cap\">\n  Ngày xửa ngày xưa, ở một vùng quê yên bình, có một cậu bé rất thích đọc sách.\n  Mỗi buổi chiều, cậu ngồi dưới gốc cây đa đầu làng, mở từng trang giấy và\n  tưởng tượng mình đang phiêu lưu qua những miền đất xa xôi.\n<\/p>\n\n<\/body>\n<\/html>"}, {"id": "banhang", "name": "Bán hàng", "html": "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>TechShop - Cửa hàng công nghệ<\/title>\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: \"Segoe UI\", Roboto, Arial, sans-serif; background: #f3f4f6; color: #1f2937; line-height: 1.5; }\n  a { text-decoration: none; color: inherit; }\n  button { font: inherit; cursor: pointer; }\n\n  /* Header */\n  .header { position: sticky; top: 0; z-index: 50; background: #0f172a; color: #fff;\n    display: flex; align-items: center; gap: 20px; padding: 12px 24px; }\n  .logo { font-size: 22px; font-weight: 700; }\n  .logo span { color: #38bdf8; }\n  .search { flex: 1; max-width: 520px; }\n  .search input { width: 100%; padding: 10px 14px; border: 0; border-radius: 8px; font: inherit; }\n  .cart-btn { margin-left: auto; position: relative; background: #38bdf8; color: #0f172a;\n    border: 0; padding: 10px 16px; border-radius: 8px; font-weight: 700; }\n  .cart-btn .count { position: absolute; top: -8px; right: -8px; background: #ef4444; color: #fff;\n    min-width: 22px; height: 22px; border-radius: 11px; font-size: 12px;\n    display: grid; place-items: center; padding: 0 5px; }\n\n  /* Banner */\n  .banner { background: linear-gradient(135deg, #1e3a8a, #0f172a); color: #fff;\n    padding: 48px 24px; text-align: center; }\n  .banner h1 { font-size: 32px; margin-bottom: 8px; }\n  .banner p { color: #cbd5e1; }\n\n  /* Bộ lọc */\n  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }\n  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }\n  .filters button { background: #fff; border: 1px solid #d1d5db; padding: 8px 16px; border-radius: 999px; }\n  .filters button.active { background: #0f172a; color: #fff; border-color: #0f172a; }\n\n  /* Sản phẩm */\n  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }\n  .product { background: #fff; border-radius: 14px; overflow: hidden;\n    box-shadow: 0 1px 3px rgba(0,0,0,.1); display: flex; flex-direction: column; transition: transform .2s; }\n  .product:hover { transform: translateY(-4px); }\n  .thumb { height: 150px; display: grid; place-items: center; font-size: 64px; background: #e0f2fe; position: relative; }\n  .sale { position: absolute; top: 10px; left: 10px; background: #ef4444; color: #fff;\n    font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }\n  .info { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }\n  .info h3 { font-size: 16px; }\n  .info .desc { font-size: 13px; color: #6b7280; flex: 1; }\n  .price { font-size: 18px; font-weight: 700; color: #dc2626; }\n  .price del { font-size: 13px; color: #9ca3af; font-weight: 400; margin-left: 6px; }\n  .add { background: #0f172a; color: #fff; border: 0; padding: 10px; border-radius: 8px; margin-top: 6px; }\n  .add:hover { background: #1e3a8a; }\n  .empty { text-align: center; color: #6b7280; padding: 40px 0; grid-column: 1 / -1; }\n\n  /* Giỏ hàng */\n  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; visibility: hidden;\n    transition: .25s; z-index: 90; }\n  .overlay.show { opacity: 1; visibility: visible; }\n  .cart { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: #fff;\n    z-index: 100; transform: translateX(100%); transition: transform .3s;\n    display: flex; flex-direction: column; }\n  .cart.show { transform: translateX(0); }\n  .cart-head { display: flex; justify-content: space-between; align-items: center;\n    padding: 18px 20px; border-bottom: 1px solid #e5e7eb; }\n  .cart-head button { background: none; border: 0; font-size: 22px; }\n  .cart-items { flex: 1; overflow-y: auto; padding: 10px 20px; }\n  .item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }\n  .item .ico { font-size: 32px; width: 52px; height: 52px; background: #e0f2fe; border-radius: 10px;\n    display: grid; place-items: center; flex: none; }\n  .item .meta { flex: 1; font-size: 14px; }\n  .item .meta b { display: block; }\n  .qty { display: flex; align-items: center; gap: 8px; margin-top: 4px; }\n  .qty button { width: 26px; height: 26px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; }\n  .remove { background: none; border: 0; color: #ef4444; font-size: 18px; }\n  .cart-foot { padding: 18px 20px; border-top: 1px solid #e5e7eb; }\n  .total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 12px; }\n  .checkout { width: 100%; background: #16a34a; color: #fff; border: 0; padding: 13px; border-radius: 8px; font-weight: 700; }\n  .cart-empty { text-align: center; color: #6b7280; padding: 40px 0; }\n\n  /* Thông báo */\n  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 80px); background: #0f172a;\n    color: #fff; padding: 12px 20px; border-radius: 8px; transition: transform .3s; z-index: 200; }\n  .toast.show { transform: translate(-50%, 0); }\n\n  .footer { background: #0f172a; color: #94a3b8; text-align: center; padding: 24px; margin-top: 40px; font-size: 14px; }\n\n  @media (max-width: 640px) {\n    .header { flex-wrap: wrap; }\n    .search { order: 3; max-width: none; flex-basis: 100%; }\n    .banner h1 { font-size: 24px; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<header class=\"header\">\n  <a href=\"#\" class=\"logo\">Tech<span>Shop<\/span><\/a>\n  <div class=\"search\"><input type=\"search\" id=\"search\" placeholder=\"Tìm sản phẩm...\"><\/div>\n  <button class=\"cart-btn\" id=\"openCart\">🛒 Giỏ hàng <span class=\"count\" id=\"count\">0<\/span><\/button>\n<\/header>\n\n<section class=\"banner\">\n  <h1>Đồ công nghệ chính hãng, giá tốt mỗi ngày<\/h1>\n  <p>Miễn phí giao hàng cho đơn từ 500.000đ<\/p>\n<\/section>\n\n<main class=\"container\">\n  <div class=\"filters\" id=\"filters\"><\/div>\n  <div class=\"grid\" id=\"grid\"><\/div>\n<\/main>\n\n<footer class=\"footer\">© 2026 TechShop. Hotline: 0900 000 000<\/footer>\n\n<div class=\"overlay\" id=\"overlay\"><\/div>\n<aside class=\"cart\" id=\"cart\">\n  <div class=\"cart-head\"><h2>Giỏ hàng<\/h2><button id=\"closeCart\" aria-label=\"Đóng\">✕<\/button><\/div>\n  <div class=\"cart-items\" id=\"cartItems\"><\/div>\n  <div class=\"cart-foot\">\n    <div class=\"total\"><span>Tổng cộng<\/span><span id=\"total\">0đ<\/span><\/div>\n    <button class=\"checkout\" id=\"checkout\">Thanh toán<\/button>\n  <\/div>\n<\/aside>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n  const products = [\n    { id: 1, name: \"Chuột không dây\", cat: \"Phụ kiện\", icon: \"🖱️\", price: 250000, old: 320000, desc: \"Kết nối 2.4GHz, pin dùng 12 tháng.\" },\n    { id: 2, name: \"Bàn phím cơ\", cat: \"Phụ kiện\", icon: \"⌨️\", price: 890000, old: 0, desc: \"Switch blue, đèn nền RGB.\" },\n    { id: 3, name: \"Tai nghe Bluetooth\", cat: \"Âm thanh\", icon: \"🎧\", price: 590000, old: 750000, desc: \"Chống ồn, pin 30 giờ.\" },\n    { id: 4, name: \"Loa mini\", cat: \"Âm thanh\", icon: \"🔊\", price: 420000, old: 0, desc: \"Chống nước IPX7, âm bass mạnh.\" },\n    { id: 5, name: \"Laptop văn phòng\", cat: \"Máy tính\", icon: \"💻\", price: 12500000, old: 13900000, desc: \"RAM 16GB, SSD 512GB, màn 14 inch.\" },\n    { id: 6, name: \"Màn hình 24 inch\", cat: \"Máy tính\", icon: \"🖥️\", price: 2890000, old: 0, desc: \"Full HD, tần số quét 75Hz.\" },\n    { id: 7, name: \"Điện thoại thông minh\", cat: \"Điện thoại\", icon: \"📱\", price: 6990000, old: 7990000, desc: \"Camera 50MP, pin 5000mAh.\" },\n    { id: 8, name: \"Sạc dự phòng 20.000mAh\", cat: \"Điện thoại\", icon: \"🔋\", price: 350000, old: 0, desc: \"Sạc nhanh 22.5W, 2 cổng ra.\" },\n    { id: 9, name: \"Webcam Full HD\", cat: \"Phụ kiện\", icon: \"📷\", price: 480000, old: 0, desc: \"Micro tích hợp, cắm là chạy.\" },\n    { id: 10, name: \"Ổ cứng SSD 1TB\", cat: \"Máy tính\", icon: \"💾\", price: 1650000, old: 1890000, desc: \"Tốc độ đọc 3500MB/s.\" }\n  ];\n\n  const $ = id => document.getElementById(id);\n  const fmt = n => n.toLocaleString(\"vi-VN\") + \"đ\";\n  let cart = {};      // { id: số lượng }\n  let category = \"Tất cả\";\n  let keyword = \"\";\n\n  // Bộ lọc danh mục\n  const cats = [\"Tất cả\", ...new Set(products.map(p => p.cat))];\n  function renderFilters() {\n    $(\"filters\").innerHTML = cats.map(c =>\n      `<button class=\"${c === category ? \"active\" : \"\"}\" data-cat=\"${c}\">${c}<\/button>`).join(\"\");\n  }\n  $(\"filters\").addEventListener(\"click\", e => {\n    if (e.target.dataset.cat) { category = e.target.dataset.cat; renderFilters(); renderProducts(); }\n  });\n\n  // Danh sách sản phẩm\n  function renderProducts() {\n    const list = products.filter(p =>\n      (category === \"Tất cả\" || p.cat === category) &&\n      p.name.toLowerCase().includes(keyword.toLowerCase()));\n    $(\"grid\").innerHTML = list.length ? list.map(p => `\n      <article class=\"product\">\n        <div class=\"thumb\">${p.icon}\n          ${p.old ? `<span class=\"sale\">-${Math.round((1 - p.price / p.old) * 100)}%<\/span>` : \"\"}\n        <\/div>\n        <div class=\"info\">\n          <h3>${p.name}<\/h3>\n          <p class=\"desc\">${p.desc}<\/p>\n          <div class=\"price\">${fmt(p.price)}${p.old ? `<del>${fmt(p.old)}<\/del>` : \"\"}<\/div>\n          <button class=\"add\" data-add=\"${p.id}\">Thêm vào giỏ<\/button>\n        <\/div>\n      <\/article>`).join(\"\") : `<p class=\"empty\">Không tìm thấy sản phẩm phù hợp.<\/p>`;\n  }\n  $(\"grid\").addEventListener(\"click\", e => {\n    if (e.target.dataset.add) addToCart(+e.target.dataset.add);\n  });\n  $(\"search\").addEventListener(\"input\", e => { keyword = e.target.value; renderProducts(); });\n\n  // Giỏ hàng\n  function addToCart(id) {\n    cart[id] = (cart[id] || 0) + 1;\n    updateCart();\n    toast(\"Đã thêm \\\"\" + products.find(p => p.id === id).name + \"\\\" vào giỏ\");\n  }\n  function changeQty(id, d) {\n    cart[id] += d;\n    if (cart[id] <= 0) delete cart[id];\n    updateCart();\n  }\n  function updateCart() {\n    const ids = Object.keys(cart);\n    let total = 0, count = 0;\n    $(\"cartItems\").innerHTML = ids.length ? ids.map(id => {\n      const p = products.find(x => x.id == id), q = cart[id];\n      total += p.price * q; count += q;\n      return `<div class=\"item\">\n        <div class=\"ico\">${p.icon}<\/div>\n        <div class=\"meta\"><b>${p.name}<\/b>${fmt(p.price)}\n          <div class=\"qty\">\n            <button data-minus=\"${p.id}\">−<\/button><span>${q}<\/span><button data-plus=\"${p.id}\">+<\/button>\n          <\/div><\/div>\n        <button class=\"remove\" data-del=\"${p.id}\" aria-label=\"Xóa\">🗑<\/button>\n      <\/div>`;\n    }).join(\"\") : `<p class=\"cart-empty\">Giỏ hàng đang trống.<\/p>`;\n    $(\"total\").textContent = fmt(total);\n    $(\"count\").textContent = count;\n  }\n  $(\"cartItems\").addEventListener(\"click\", e => {\n    const d = e.target.dataset;\n    if (d.plus) changeQty(+d.plus, 1);\n    if (d.minus) changeQty(+d.minus, -1);\n    if (d.del) { delete cart[d.del]; updateCart(); }\n  });\n\n  // Mở/đóng giỏ\n  const toggleCart = show => {\n    $(\"cart\").classList.toggle(\"show\", show);\n    $(\"overlay\").classList.toggle(\"show\", show);\n  };\n  $(\"openCart\").onclick = () => toggleCart(true);\n  $(\"closeCart\").onclick = $(\"overlay\").onclick = () => toggleCart(false);\n\n  $(\"checkout\").onclick = () => {\n    if (!Object.keys(cart).length) return toast(\"Giỏ hàng đang trống\");\n    cart = {}; updateCart(); toggleCart(false);\n    toast(\"Đặt hàng thành công! Cảm ơn bạn.\");\n  };\n\n  // Thông báo nhỏ\n  let timer;\n  function toast(msg) {\n    $(\"toast\").textContent = msg;\n    $(\"toast\").classList.add(\"show\");\n    clearTimeout(timer);\n    timer = setTimeout(() => $(\"toast\").classList.remove(\"show\"), 2000);\n  }\n\n  renderFilters(); renderProducts(); updateCart();\n<\/script>\n<\/body>\n<\/html>"}, {"id": "dangki", "name": "Đăng kí thành viên", "html": "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Đăng ký thành viên<\/title>\n<style>\n  :root {\n    --bg: #eef3f1;\n    --card: #ffffff;\n    --text: #1d2b27;\n    --muted: #5d6e68;\n    --line: #cfdad6;\n    --brand: #0f6b57;\n    --brand-dark: #0a4f40;\n    --error: #b3261e;\n    --side: #0f6b57;\n    --side-text: #f2fbf8;\n  }\n  @media (prefers-color-scheme: dark) {\n    :root:not([data-theme=\"light\"]) {\n      --bg: #101a17; --card: #17231f; --text: #e8f2ee; --muted: #9bb0a8;\n      --line: #2c3f39; --brand: #3fc1a1; --brand-dark: #2da184; --error: #ff8a80;\n      --side: #0c3d32; --side-text: #e8f2ee;\n    }\n  }\n  * { box-sizing: border-box; }\n  body {\n    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);\n    font-family: \"Segoe UI\", Roboto, Arial, sans-serif;\n    display: flex; align-items: center; justify-content: center; padding: 24px 16px;\n  }\n  .wrap {\n    width: 100%; max-width: 920px; display: grid; grid-template-columns: 1fr 1.25fr;\n    background: var(--card); border-radius: 18px; overflow: hidden;\n    box-shadow: 0 10px 40px rgba(0,0,0,.12);\n  }\n  .side { background: var(--side); color: var(--side-text); padding: 40px 32px; }\n  .side h1 { font-size: 28px; line-height: 1.25; margin: 0 0 16px; }\n  .side p { margin: 0 0 24px; opacity: .85; line-height: 1.6; }\n  .side ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }\n  .side li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; }\n  .side li::before { content: \"✓\"; font-weight: 700; flex: none; }\n  .main { padding: 40px 36px; }\n  .main h2 { margin: 0 0 6px; font-size: 22px; }\n  .main .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }\n  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n  .field { margin-bottom: 16px; }\n  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }\n  input[type=text], input[type=email], input[type=tel], input[type=password], input[type=date] {\n    width: 100%; padding: 11px 12px; font: inherit; color: var(--text);\n    background: transparent; border: 1.5px solid var(--line); border-radius: 8px;\n  }\n  input:focus-visible, button:focus-visible {\n    outline: 3px solid var(--brand); outline-offset: 2px; border-color: var(--brand);\n  }\n  .field.invalid input { border-color: var(--error); }\n  .msg { display: none; color: var(--error); font-size: 13px; margin-top: 5px; }\n  .field.invalid .msg { display: block; }\n  .pw { position: relative; }\n  .pw button {\n    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);\n    background: none; border: 0; color: var(--brand); font: inherit; font-size: 13px;\n    font-weight: 600; cursor: pointer; padding: 6px 8px;\n  }\n  .meter { height: 5px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }\n  .meter span { display: block; height: 100%; width: 0; background: var(--error); transition: width .2s, background .2s; }\n  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }\n  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin-bottom: 18px; font-weight: 400; }\n  .check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--brand); flex: none; }\n  .check a { color: var(--brand); }\n  .btn {\n    width: 100%; padding: 13px; font: inherit; font-weight: 700; color: #fff;\n    background: var(--brand-dark); border: 0; border-radius: 8px; cursor: pointer;\n  }\n  .btn:hover { filter: brightness(1.08); }\n  .login { text-align: center; font-size: 14px; color: var(--muted); margin: 16px 0 0; }\n  .login a { color: var(--brand); font-weight: 600; }\n  .success { display: none; text-align: center; padding: 40px 10px; }\n  .success .ok {\n    width: 64px; height: 64px; border-radius: 50%; background: var(--brand-dark); color: #fff;\n    display: grid; place-items: center; font-size: 32px; margin: 0 auto 16px;\n  }\n  .success h2 { margin-bottom: 8px; }\n  .success p { color: var(--muted); line-height: 1.6; }\n  @media (max-width: 760px) {\n    .wrap { grid-template-columns: 1fr; }\n    .side { padding: 28px 24px; }\n    .side h1 { font-size: 22px; }\n    .side ul { display: none; }\n    .side p { margin: 0; }\n    .main { padding: 28px 22px; }\n    .row { grid-template-columns: 1fr; gap: 0; }\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <aside class=\"side\">\n    <h1>Tham gia cộng đồng của chúng tôi<\/h1>\n    <p>Tạo tài khoản chỉ mất một phút và hoàn toàn miễn phí.<\/p>\n    <ul>\n      <li>Nhận ưu đãi dành riêng cho thành viên<\/li>\n      <li>Lưu lịch sử và thông tin cá nhân<\/li>\n      <li>Cập nhật tin mới sớm nhất<\/li>\n    <\/ul>\n  <\/aside>\n\n  <main class=\"main\">\n    <form id=\"form\" novalidate>\n      <h2>Đăng ký thành viên<\/h2>\n      <p class=\"sub\">Điền thông tin bên dưới để tạo tài khoản.<\/p>\n\n      <div class=\"field\" data-f=\"name\">\n        <label for=\"name\">Họ và tên<\/label>\n        <input type=\"text\" id=\"name\" autocomplete=\"name\" placeholder=\"Nguyễn Văn A\">\n        <div class=\"msg\">Vui lòng nhập họ và tên (ít nhất 2 ký tự).<\/div>\n      <\/div>\n\n      <div class=\"row\">\n        <div class=\"field\" data-f=\"email\">\n          <label for=\"email\">Email<\/label>\n          <input type=\"email\" id=\"email\" autocomplete=\"email\" placeholder=\"ban@email.com\">\n          <div class=\"msg\">Email chưa đúng định dạng.<\/div>\n        <\/div>\n        <div class=\"field\" data-f=\"phone\">\n          <label for=\"phone\">Số điện thoại<\/label>\n          <input type=\"tel\" id=\"phone\" autocomplete=\"tel\" placeholder=\"0901234567\">\n          <div class=\"msg\">Số điện thoại gồm 10 chữ số, bắt đầu bằng 0.<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"field\" data-f=\"dob\">\n        <label for=\"dob\">Ngày sinh<\/label>\n        <input type=\"date\" id=\"dob\" autocomplete=\"bday\">\n        <div class=\"msg\">Bạn cần từ 13 tuổi trở lên để đăng ký.<\/div>\n      <\/div>\n\n      <div class=\"field\" data-f=\"pass\">\n        <label for=\"pass\">Mật khẩu<\/label>\n        <div class=\"pw\">\n          <input type=\"password\" id=\"pass\" autocomplete=\"new-password\" placeholder=\"Tối thiểu 8 ký tự\">\n          <button type=\"button\" id=\"toggle\">Hiện<\/button>\n        <\/div>\n        <div class=\"meter\"><span id=\"bar\"><\/span><\/div>\n        <div class=\"hint\" id=\"strength\">Dùng chữ hoa, chữ thường và số.<\/div>\n        <div class=\"msg\">Mật khẩu cần ít nhất 8 ký tự, có chữ và số.<\/div>\n      <\/div>\n\n      <div class=\"field\" data-f=\"pass2\">\n        <label for=\"pass2\">Nhập lại mật khẩu<\/label>\n        <input type=\"password\" id=\"pass2\" autocomplete=\"new-password\">\n        <div class=\"msg\">Mật khẩu nhập lại chưa khớp.<\/div>\n      <\/div>\n\n      <div class=\"field\" data-f=\"agree\">\n        <label class=\"check\">\n          <input type=\"checkbox\" id=\"agree\">\n          <span>Tôi đồng ý với <a href=\"#\" onclick=\"return false\">điều khoản sử dụng<\/a> và <a href=\"#\" onclick=\"return false\">chính sách bảo mật<\/a>.<\/span>\n        <\/label>\n        <div class=\"msg\">Bạn cần đồng ý điều khoản để tiếp tục.<\/div>\n      <\/div>\n\n      <button class=\"btn\" type=\"submit\">Tạo tài khoản<\/button>\n      <p class=\"login\">Đã có tài khoản? <a href=\"#\" onclick=\"return false\">Đăng nhập<\/a><\/p>\n    <\/form>\n\n    <div class=\"success\" id=\"success\" role=\"status\">\n      <div class=\"ok\">✓<\/div>\n      <h2>Đăng ký thành công<\/h2>\n      <p id=\"welcome\"><\/p>\n    <\/div>\n  <\/main>\n<\/div>\n\n<script>\n  const $ = id => document.getElementById(id);\n  const form = $('form');\n\n  const rules = {\n    name: () => $('name').value.trim().length >= 2,\n    email: () => /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test($('email').value.trim()),\n    phone: () => /^0\\d{9}$/.test($('phone').value.replace(/\\s/g, '')),\n    dob: () => {\n      const v = $('dob').value;\n      if (!v) return false;\n      const d = new Date(v), now = new Date();\n      let age = now.getFullYear() - d.getFullYear();\n      const m = now.getMonth() - d.getMonth();\n      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;\n      return age >= 13 && age < 120;\n    },\n    pass: () => /^(?=.*[A-Za-z])(?=.*\\d).{8,}$/.test($('pass').value),\n    pass2: () => $('pass2').value !== '' && $('pass2').value === $('pass').value,\n    agree: () => $('agree').checked\n  };\n\n  function check(key) {\n    const ok = rules[key]();\n    document.querySelector('[data-f=\"' + key + '\"]').classList.toggle('invalid', !ok);\n    return ok;\n  }\n\n  Object.keys(rules).forEach(key => {\n    const el = $(key);\n    el.addEventListener('blur', () => check(key));\n    el.addEventListener('input', () => {\n      const field = document.querySelector('[data-f=\"' + key + '\"]');\n      if (field.classList.contains('invalid')) check(key);\n    });\n  });\n\n  $('toggle').addEventListener('click', () => {\n    const show = $('pass').type === 'password';\n    $('pass').type = show ? 'text' : 'password';\n    $('pass2').type = show ? 'text' : 'password';\n    $('toggle').textContent = show ? 'Ẩn' : 'Hiện';\n  });\n\n  $('pass').addEventListener('input', () => {\n    const v = $('pass').value;\n    let s = 0;\n    if (v.length >= 8) s++;\n    if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;\n    if (/\\d/.test(v)) s++;\n    if (/[^A-Za-z0-9]/.test(v)) s++;\n    const labels = ['Rất yếu', 'Yếu', 'Trung bình', 'Khá mạnh', 'Mạnh'];\n    const colors = ['#b3261e', '#d9622b', '#d9a42b', '#6aa84f', '#0f6b57'];\n    $('bar').style.width = (v ? (s + 1) * 20 : 0) + '%';\n    $('bar').style.background = colors[s];\n    $('strength').textContent = v ? 'Độ mạnh: ' + labels[s] : 'Dùng chữ hoa, chữ thường và số.';\n    if ($('pass2').value) check('pass2');\n  });\n\n  form.addEventListener('submit', e => {\n    e.preventDefault();\n    const results = Object.keys(rules).map(check);\n    if (results.every(Boolean)) {\n      $('welcome').textContent = 'Chào mừng ' + $('name').value.trim() +\n        '! Chúng tôi đã gửi email xác nhận tới ' + $('email').value.trim() + '.';\n      form.style.display = 'none';\n      $('success').style.display = 'block';\n    } else {\n      const first = document.querySelector('.field.invalid input');\n      if (first) first.focus();\n    }\n  });\n<\/script>\n<\/body>\n<\/html>"}];

  const bar = document.getElementById("bar");
  const view = document.getElementById("view");

  bar.innerHTML = '<span class="brand">Bài tập</span>' + pages.map(p =>
    '<button class="tab" role="tab" data-id="' + p.id + '">' + p.name + '</button>').join("");

  function show(id) {
    const p = pages.find(x => x.id === id) || pages[0];
    view.srcdoc = p.html;
    document.title = p.name + " - Bài tập";
    bar.querySelectorAll(".tab").forEach(t =>
      t.setAttribute("aria-selected", t.dataset.id === p.id));
  }
  bar.addEventListener("click", e => { if (e.target.dataset.id) location.hash = e.target.dataset.id; });
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
</body>
</html>
